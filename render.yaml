services:
  - type: web
    name: farm-to-platform-backend
    env: node
    buildCommand: cd Backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd Backend && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BACKEND_PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /api/health
